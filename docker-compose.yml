version: '3.8'

services:
  # Distributed Cache & Real-Time Socket.io Message Broker
  redis:
    image: redis:7-alpine
    container_name: orderkare-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60
    volumes:
      - redis_data:/data
    networks:
      - orderkare_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend Horizontal Replica 1
  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orderkare-backend-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DB_POOL_MAX=25
      - DB_POOL_MIN=2
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orderkare_net

  # Backend Horizontal Replica 2
  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orderkare-backend-2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DB_POOL_MAX=25
      - DB_POOL_MIN=2
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orderkare_net

  # Backend Horizontal Replica 3
  backend-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orderkare-backend-3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_URL=redis://redis:6379
      - DB_POOL_MAX=25
      - DB_POOL_MIN=2
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orderkare_net

  # Production Frontend Web Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orderkare-frontend
    restart: always
    networks:
      - orderkare_net

  # High-Concurrency Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:1.27-alpine
    container_name: orderkare-load-balancer
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - frontend
    networks:
      - orderkare_net

networks:
  orderkare_net:
    driver: bridge

volumes:
  redis_data:
