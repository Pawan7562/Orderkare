user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance & Network Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15s;
    send_timeout 15s;

    client_max_body_size 30M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting & Concurrency Zones for DDoS & Traffic Spikes
    limit_req_zone $binary_remote_addr zone=api_rate_limit:20m rate=150r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:20m;

    # WebSocket Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Upstream Backend Horizontally Scaled Node Cluster
    upstream orderkare_backend_cluster {
        least_conn; # Distribute to least busy replica
        server backend-1:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend-2:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend-3:5000 max_fails=3 fail_timeout=10s weight=1;
        keepalive 128; # Reuse persistent HTTP/1.1 connections to backends
    }

    # Upstream Frontend Service
    upstream orderkare_frontend_cluster {
        server frontend:80;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost _;

        # Rate Limit & Connection Limiting
        limit_conn conn_limit 100;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        # WebSocket real-time order alerts & staff calls
        location /socket.io/ {
            proxy_pass http://orderkare_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Extended timeouts for persistent WebSocket rooms
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Backend REST API Routes
        location ~ ^/(api|auth|menu|categories|foods|orders|tables|restaurants|subscriptions|ads|plans|settings|admin|devops) {
            limit_req zone=api_rate_limit burst=200 nodelay;

            proxy_pass http://orderkare_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # High concurrency proxy buffer tuning
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Health Check Endpoint
        location /health {
            proxy_pass http://orderkare_backend_cluster/api/health;
            access_log off;
        }

        # Static Web App
        location / {
            proxy_pass http://orderkare_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
